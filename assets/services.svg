<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="Bitcoin mining · Pool operations · GPU for AI · Hardware colocation">
  <style>
    .mono{font-family:ui-monospace,'IBM Plex Mono',SFMono-Regular,Consolas,monospace}
    .sans{font-family:Inter,'Helvetica Neue','Segoe UI',Arial,sans-serif}
    .blink{animation:b 2s steps(1) infinite}
    @keyframes b{50%{opacity:.25}}
    .flow{stroke-dasharray:4 6;animation:f 1.2s linear infinite}
    @keyframes f{to{stroke-dashoffset:-20}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1200" height="210" fill="#0b0e12"/>
  <rect x=".5" y=".5" width="1199" height="209" fill="none" stroke="#303235"/>
  <line x1="300.5" y1="0" x2="300.5" y2="210" stroke="#303235"/>
  <line x1="600.5" y1="0" x2="600.5" y2="210" stroke="#303235"/>
  <line x1="900.5" y1="0" x2="900.5" y2="210" stroke="#303235"/>

  <!-- 1 mining: hash grid -->
  <g transform="translate(28 30)">
    <g fill="#303235">
      <rect x="0" y="0" width="8" height="8"/><rect x="11" y="0" width="8" height="8"/><rect x="22" y="0" width="8" height="8"/>
      <rect x="0" y="11" width="8" height="8"/><rect x="22" y="11" width="8" height="8"/>
      <rect x="0" y="22" width="8" height="8"/><rect x="11" y="22" width="8" height="8"/><rect x="22" y="22" width="8" height="8"/>
    </g>
    <rect class="blink" x="11" y="11" width="8" height="8" fill="#00d892"/>
    <text class="mono" x="0" y="74" font-size="11" letter-spacing="1.8" fill="#00d892">HASHRATE</text>
    <text class="sans" x="0" y="108" font-size="26" fill="#dedede">Bitcoin mining</text>
    <text class="sans" x="0" y="140" font-size="14.5" fill="#818284">Dedicated SHA-256 ASIC fleet</text>
    <text class="mono" x="0" y="160" font-size="11" fill="#818284">Antminer · WhatsMiner class</text>
  </g>

  <!-- 2 pool -->
  <g transform="translate(328 30)">
    <circle cx="15" cy="15" r="6" fill="none" stroke="#dedede" stroke-width="1.5"/>
    <line class="flow" x1="21" y1="15" x2="60" y2="4" stroke="#00d892" stroke-width="1.5"/>
    <line class="flow" x1="21" y1="15" x2="60" y2="15" stroke="#00d892" stroke-width="1.5"/>
    <line class="flow" x1="21" y1="15" x2="60" y2="26" stroke="#00d892" stroke-width="1.5"/>
    <rect x="60" y="1" width="6" height="6" fill="#303235"/><rect x="60" y="12" width="6" height="6" fill="#303235"/><rect x="60" y="23" width="6" height="6" fill="#303235"/>
    <text class="mono" x="0" y="74" font-size="11" letter-spacing="1.8" fill="#00d892">COORDINATION</text>
    <text class="sans" x="0" y="108" font-size="26" fill="#dedede">Pool operations</text>
    <text class="sans" x="0" y="140" font-size="14.5" fill="#818284">From worker to valid share</text>
    <text class="mono" x="0" y="160" font-size="11" fill="#818284">jobs → shares → blocks</text>
  </g>

  <!-- 3 gpu -->
  <g transform="translate(628 30)">
    <rect x=".75" y="4.75" width="58" height="22" fill="none" stroke="#dedede" stroke-width="1.5"/>
    <g fill="#303235"><rect x="6" y="10" width="10" height="11"/><rect x="19" y="10" width="10" height="11"/><rect x="32" y="10" width="10" height="11"/></g>
    <rect class="blink" x="47" y="13" width="6" height="6" fill="#00d892"/>
    <text class="mono" x="0" y="74" font-size="11" letter-spacing="1.8" fill="#00d892">COMPUTE</text>
    <text class="sans" x="0" y="108" font-size="26" fill="#dedede">GPU for AI</text>
    <text class="sans" x="0" y="140" font-size="14.5" fill="#818284">Training, fine-tuning, inference</text>
    <text class="mono" x="0" y="160" font-size="11" fill="#818284">H100 / H200 class</text>
  </g>

  <!-- 4 colocation -->
  <g transform="translate(928 30)">
    <rect x=".75" y=".75" width="26" height="30" fill="none" stroke="#dedede" stroke-width="1.5"/>
    <g fill="#303235"><rect x="5" y="5" width="18" height="4"/><rect x="5" y="12" width="18" height="4"/><rect x="5" y="19" width="18" height="4"/></g>
    <rect x="34.75" y=".75" width="26" height="30" fill="none" stroke="#818284" stroke-width="1.5" stroke-dasharray="3 3"/>
    <rect class="blink" x="44" y="12" width="7" height="7" fill="#00d892"/>
    <text class="mono" x="0" y="74" font-size="11" letter-spacing="1.8" fill="#00d892">PLACEMENT</text>
    <text class="sans" x="0" y="108" font-size="26" fill="#dedede">Colocation</text>
    <text class="sans" x="0" y="140" font-size="14.5" fill="#818284">Your equipment, our facilities</text>
    <text class="mono" x="0" y="160" font-size="11" fill="#818284">rack · power · remote hands</text>
  </g>
</svg>
