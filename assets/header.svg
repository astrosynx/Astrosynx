<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="Astrosynx: Bitcoin mining. AI compute. One foundation.">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0e12" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0e12" stop-opacity=".85"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f5"/>
      <stop offset="1" stop-color="#a9aaad"/>
    </linearGradient>
    <pattern id="units" width="118" height="14" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="118" height="12" fill="#1f2124"/>
      <rect x="6" y="5" width="56" height="2" fill="#303235"/>
    </pattern>
  </defs>
  <style>
    .mono{font-family:ui-monospace,'IBM Plex Mono',SFMono-Regular,Consolas,monospace}
    .sans{font-family:Inter,'Helvetica Neue','Segoe UI',Arial,sans-serif}
    .led{animation:led 2.4s steps(1) infinite}
    @keyframes led{0%,100%{opacity:1}50%{opacity:.25}}
    .rise{opacity:0;animation:rise .9s ease-out forwards}
    .r1{animation-delay:.1s}.r2{animation-delay:.3s}.r3{animation-delay:.5s}.r4{animation-delay:.7s}.r5{animation-delay:.9s}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .scan{animation:scan 5s linear infinite}
    @keyframes scan{from{transform:translateY(0)}to{transform:translateY(300px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.rise{opacity:1}}
  </style>

  <rect width="1200" height="430" fill="#0b0e12"/>

  <!-- top bar -->
  <!-- ribbon mark: flat folds behind, rounded uprights in front -->
  <g transform="translate(42 20)">
    <g fill="#6c6d70">
      <polygon points="6,2 12.5,2 20.3,28.5 13.8,28.5"/>
      <polygon points="19,10 25.3,10 33,28.5 26.7,28.5"/>
    </g>
    <g fill="none" stroke="url(#mark)" stroke-width="6.3" stroke-linecap="round">
      <line x1="3.6" y1="26.7" x2="6" y2="5.1"/>
      <line x1="16.8" y1="26.7" x2="21" y2="12.9"/>
      <line x1="30.9" y1="26.7" x2="33" y2="19.8"/>
    </g>
  </g>
  <text class="mono" x="92" y="43" font-size="15" letter-spacing="3" fill="#dedede">ASTROSYNX</text>
  <text class="mono" x="1160" y="42" text-anchor="end" font-size="11" letter-spacing="1.5" fill="#818284">BITCOIN MINING   AI COMPUTE   COLOCATION   STAKING</text>
  <line x1="0" y1="70.5" x2="1200" y2="70.5" stroke="#303235"/>

  <!-- copy -->
  <g class="rise r1">
    <rect x="40" y="117" width="7" height="7" fill="#00d892"/>
    <text class="mono" x="56" y="124" font-size="11.5" letter-spacing="1.8" fill="#bababb">MINING &amp; COMPUTE INFRASTRUCTURE</text>
  </g>
  <text class="sans rise r2" x="38" y="190" font-size="56" font-weight="400" letter-spacing="-1.2" fill="#dedede">Bitcoin mining.</text>
  <text class="sans rise r3" x="38" y="252" font-size="56" font-weight="400" letter-spacing="-1.2" fill="#dedede">AI compute.</text>
  <text class="sans rise r4" x="38" y="314" font-size="56" font-weight="400" letter-spacing="-1.2" fill="#dedede">One foundation.</text>
  <g class="rise r5">
    <text class="sans" x="40" y="360" font-size="16.5" fill="#818284">Physical infrastructure turned into productive compute:</text>
    <text class="sans" x="40" y="384" font-size="16.5" fill="#818284">ASIC mining, pool operations, GPU capacity and colocation.</text>
  </g>

  <!-- rack hall -->
  <g transform="translate(660 96)">
    <rect x=".5" y=".5" width="499" height="309" fill="#181a1d" stroke="#303235"/>
    <!-- three racks -->
    <g>
      <rect x="28" y="28" width="134" height="262" fill="#0b0e12" stroke="#303235"/>
      <rect x="36" y="36" width="118" height="246" fill="url(#units)"/>
      <rect x="183" y="28" width="134" height="262" fill="#0b0e12" stroke="#303235"/>
      <rect x="191" y="36" width="118" height="246" fill="url(#units)"/>
      <rect x="338" y="28" width="134" height="262" fill="#0b0e12" stroke="#303235"/>
      <rect x="346" y="36" width="118" height="246" fill="url(#units)"/>
    </g>
    <!-- status leds -->
    <g fill="#00d892" filter="url(#glow)">
      <rect class="led" x="140" y="40" width="4" height="4"/>
      <rect class="led" x="140" y="82" width="4" height="4" style="animation-delay:.6s"/>
      <rect class="led" x="140" y="124" width="4" height="4" style="animation-delay:1.3s"/>
      <rect class="led" x="140" y="180" width="4" height="4" style="animation-delay:.3s"/>
      <rect class="led" x="140" y="236" width="4" height="4" style="animation-delay:1.9s"/>
      <rect class="led" x="295" y="54" width="4" height="4" style="animation-delay:1.1s"/>
      <rect class="led" x="295" y="110" width="4" height="4" style="animation-delay:.2s"/>
      <rect class="led" x="295" y="152" width="4" height="4" style="animation-delay:1.6s"/>
      <rect class="led" x="295" y="208" width="4" height="4" style="animation-delay:.9s"/>
      <rect class="led" x="295" y="264" width="4" height="4" style="animation-delay:2.1s"/>
      <rect class="led" x="450" y="40" width="4" height="4" style="animation-delay:.5s"/>
      <rect class="led" x="450" y="96" width="4" height="4" style="animation-delay:1.4s"/>
      <rect class="led" x="450" y="166" width="4" height="4" style="animation-delay:.1s"/>
      <rect class="led" x="450" y="222" width="4" height="4" style="animation-delay:1.8s"/>
    </g>
    <g fill="#bababb" opacity=".45">
      <rect x="132" y="40" width="4" height="4"/><rect x="132" y="152" width="4" height="4"/>
      <rect x="287" y="82" width="4" height="4"/><rect x="287" y="236" width="4" height="4"/>
      <rect x="442" y="124" width="4" height="4"/><rect x="442" y="264" width="4" height="4"/>
    </g>
    <!-- scan line -->
    <g class="scan"><rect x="28" y="2" width="444" height="1" fill="#00d892" opacity=".35"/></g>
    <rect x="0" y="200" width="500" height="110" fill="url(#fade)"/>
    <!-- tag -->
    <rect x="298" y="-12" width="190" height="26" fill="#0b0e12" stroke="#303235"/>
    <rect x="310" y="-2" width="6" height="6" fill="#00d892"/>
    <text class="mono" x="324" y="5" font-size="10.5" letter-spacing="1.4" fill="#dedede">THE PHYSICAL FOUNDATION</text>
  </g>

  <rect x=".5" y=".5" width="1199" height="429" fill="none" stroke="#303235"/>
</svg>
